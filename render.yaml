services:
  - type: web
    name: mini-search-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt && python -m nltk.downloader -d nltk_data stopwords
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NLTK_DATA
        value: nltk_data
